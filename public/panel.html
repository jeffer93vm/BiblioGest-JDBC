<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BiblioGest - Panel de Gestión</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; color: #333; }
        .navbar { background: #0d6efd; color: white; padding: 15px 30px; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .btn-out { background: #dc3545; color: white; text-decoration: none; padding: 6px 14px; border-radius: 4px; font-size: 14px; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 15px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 30px; overflow: hidden; }
        .header { background: #212529; color: white; padding: 12px 20px; font-size: 18px; font-weight: bold; }
        .body { padding: 20px; }
        .row { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; }
        button { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-add { background: #198754; color: white; }
        .btn-upd { background: #ffc107; color: black; padding: 5px 10px; font-size: 12px; }
        .btn-del { background: #dc3545; color: white; padding: 5px 10px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: left; }
        th { background: #e9ecef; }
    </style>
</head>
<body>
    <div class="navbar">
        <span>📚 BiblioGest - Sistema de Gestión Bibliotecaria</span>
        <a href="/logout" class="btn-out">Cerrar Sesión</a>
    </div>
    <div class="container">
        <div class="card">
            <div class="header">Módulo 1: Gestión de Libros</div>
            <div class="body">
                <form action="/libros/agregar" method="POST" class="row">
                    <input type="text" name="isbn" placeholder="ISBN" required>
                    <input type="text" name="titulo" placeholder="Título del Libro" required>
                    <input type="text" name="autor" placeholder="Autor" required>
                    <input type="number" name="cantidad" placeholder="Stock" style="max-width:80px;" required>
                    <button type="submit" class="btn-add">+ Agregar Libro</button>
                </form>
                <table>
                    <thead><tr><th>ID</th><th>ISBN</th><th>Título</th><th>Autor</th><th>Stock</th><th>Acciones</th></tr></thead>
                    <tbody><!-- FILAS_LIBROS --></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="header">Módulo 2: Gestión de Usuarios (Lectores)</div>
            <div class="body">
                <form action="/usuarios/agregar" method="POST" class="row">
                    <input type="text" name="documento" placeholder="Documento" required>
                    <input type="text" name="nombre" placeholder="Nombre Completo" required>
                    <input type="email" name="correo" placeholder="Correo" required>
                    <input type="text" name="telefono" placeholder="Teléfono" required>
                    <button type="submit" class="btn-add">+ Crear Usuario</button>
                </form>
                <table>
                    <thead><tr><th>ID</th><th>Documento</th><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Acciones</th></tr></thead>
                    <tbody><!-- FILAS_USUARIOS --></tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
